openapi: 3.1.0
info:
  title: RBA Decision Service — Risk Evaluate API
  version: 0.9.0
  description: |
    PDP contract for the synchronous login path. Callers (PEP) authenticate the
    user first, then POST here for a risk decision. The service *decides*; the
    caller *enforces*.

    Evaluate path frozen in Phase 2 (`rba-contracts` v0.1.0). 0.9.0 makes it
    multi-tenant (ADR-0033): every request names its tenant, policy is one
    `TenantPolicy` per tenant, and the response separates the engine's verdict
    (`action`) from what the PEP must apply (`enforced_action`, ADR-0034).
    Implemented by `rba-decision-service`.
  contact:
    name: roku-pfi
    url: https://github.com/roku-pfi
servers:
  - url: http://localhost:8000
    description: Local decision-service
tags:
  - name: risk
    description: Login-risk evaluation
  - name: policy
    description: One login policy per tenant (ADR-0033, ADR-0034)
paths:
  /tenants/{tenant_id}/policy:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [policy]
      operationId: getTenantPolicy
      summary: Return a tenant's policy
      responses:
        "200":
          description: The tenant's current policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPolicy"
        "404":
          description: No policy for this tenant
    put:
      tags: [policy]
      operationId: putTenantPolicy
      summary: Replace a tenant's policy
      description: |
        Control-plane write used by the admin console (the IdP proxies it after
        checking the caller may act on this tenant). Stored in Postgres; every
        replica picks it up within its cache interval (RNF-05, RNF-10).
        Identity never lives here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPolicy"
      responses:
        "200":
          description: Policy now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPolicy"
        "422":
          description: Invalid policy (unsorted bands, missing max=1.0, or tenant_id in the body differs from the path)
  /risk/evaluate:
    post:
      tags: [risk]
      operationId: evaluateRisk
      summary: Evaluate login risk and return an enforcement action
      description: |
        Stateless PDP call. The service loads the user profile (Redis), computes
        features via `rba-features`, scores with the active model, applies the
        versioned policy config, and returns action + explanation. Decision +
        outbox row are written in one Postgres transaction (async fan-out is
        off the request path).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskEvaluateRequest"
            examples:
              novelDevice:
                $ref: "#/components/examples/EvaluateRequestNovelDevice"
      responses:
        "200":
          description: Risk decision (including fallback decisions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateResponse"
              examples:
                requireMfa:
                  $ref: "#/components/examples/EvaluateResponseRequireMfa"
        "400":
          description: Invalid request (schema / missing required fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Semantically invalid request (e.g. unparseable timestamp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /risk/confirm:
    post:
      tags: [risk]
      operationId: confirmLogin
      summary: Report that the step-up of a decision was passed
      description: |
        Called by the IdP after the user passes the step-up the decision asked
        for. The PDP emits `rba.login.confirmed.v1` with the decision's login
        snapshot, and profile-service learns that context. Only a decision whose
        enforced action was REQUIRE_MFA or REAUTHENTICATE can be confirmed, once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, tenant_id]
              properties:
                event_id: { type: string, format: uuid }
                tenant_id: { type: string }
      responses:
        "200":
          description: "`confirmed` is false when there was nothing to confirm."
          content:
            application/json:
              schema:
                type: object
                required: [event_id, confirmed]
                properties:
                  event_id: { type: string, format: uuid }
                  confirmed: { type: boolean }
        "404":
          description: No decision with that event_id in that tenant
components:
  schemas:
    Action:
      type: string
      enum: [ALLOW, REQUIRE_MFA, REAUTHENTICATE, BLOCK]
      description: Enforcement action for the PEP.
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Reason:
      type: object
      additionalProperties: false
      required: [code, signal]
      properties:
        code:
          type: string
          description: Stable machine-readable reason code (e.g. signal_novel).
          examples: [signal_novel, signal_familiar, failed_login_burst, low_history]
        signal:
          type: string
          description: Feature or Freeman categorical this reason refers to.
        contribution:
          type: number
          description: Signed contribution to risk when available.
        detail:
          type: string
    RiskEvaluateRequest:
      type: object
      additionalProperties: false
      required:
        - event_id
        - tenant_id
        - application_id
        - user_id
        - timestamp
        - ip_address
      properties:
        event_id:
          type: string
          format: uuid
          description: Caller-supplied idempotency / correlation id. Reused on the outbox event.
        tenant_id:
          type: string
          minLength: 1
          description: Selects the tenant's policy; recorded on the decision (ADR-0033).
        application_id:
          type: string
          minLength: 1
          description: The application the user is signing in to. Recorded, not used to pick policy.
        user_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
          description: Login event time (UTC). Used for hour_seen_before and failed_logins window.
        ip_address:
          type: string
          minLength: 1
        asn:
          type: string
          description: Autonomous system number/id. Missing/"-" → not seen-before.
        country:
          type: string
        device_type:
          type: string
        os:
          type: string
        browser:
          type: string
        login_successful:
          type: boolean
          default: true
          description: |
            Whether primary auth succeeded. Feeds profile failed_login_ts on update.
            Typical PEP flow posts after successful password check (true).
        user_agent:
          type: string
          description: Optional raw UA; not consumed by FeatureVectorV1.
        device_id:
          type: string
          description: Optional stable device id; not consumed by FeatureVectorV1.
        simulated:
          type: boolean
          default: false
          description: Country/ASN came from the presenter override, not the client address (ADR-0032). Scored normally, flagged on the record.
      description: |
        Fields mirror the Wiefling/canonical LoginEvent names used by rba-features
        (see schema.RAW_TO_FIELD). Latitude/longitude and RTT are intentionally
        omitted from v1 (EDA-excluded). is_attack_ip is never accepted here.
    RiskEvaluateResponse:
      type: object
      additionalProperties: false
      required:
        - event_id
        - risk_score
        - risk_level
        - action
        - enforced_action
        - engine_mode
        - reasons
        - model_version
        - policy_version
        - feature_schema_version
        - fallback
        - scored_at
      properties:
        event_id:
          type: string
          format: uuid
        risk_score:
          type: number
          minimum: 0
          maximum: 1
          description: Probability-scale risk. Policy thresholds apply to this value.
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        action:
          $ref: "#/components/schemas/Action"
          description: The engine's verdict, escalation floors included. Recorded in every mode.
        enforced_action:
          $ref: "#/components/schemas/Action"
          description: What the PEP must apply. Equals `action` when the tenant's engine is ACTIVE; the base policy's action when MONITOR.
        engine_mode:
          $ref: "#/components/schemas/EngineMode"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
          description: Top contributing signals / rule hits for explainability.
        model_version:
          type: string
        policy_version:
          type: string
        feature_schema_version:
          type: string
          examples: ["1.0.0"]
        fallback:
          type: boolean
          description: true when score came from fallback_action (scorer/profile failure).
        scored_at:
          type: string
          format: date-time
    ScoreBand:
      type: object
      additionalProperties: false
      required: [max, level]
      properties:
        max: { type: number, minimum: 0, maximum: 1 }
        level: { $ref: "#/components/schemas/RiskLevel" }
    LevelToAction:
      type: object
      additionalProperties: false
      required: [LOW, MEDIUM, HIGH, CRITICAL]
      properties:
        LOW: { $ref: "#/components/schemas/Action" }
        MEDIUM: { $ref: "#/components/schemas/Action" }
        HIGH: { $ref: "#/components/schemas/Action" }
        CRITICAL: { $ref: "#/components/schemas/Action" }
    BasePolicy:
      type: string
      enum: [PASSWORD_ONLY, ALWAYS_MFA]
      description: What the tenant enforces on a correct password without the engine. The second factor is always the passkey.
    EngineMode:
      type: string
      enum: [OFF, MONITOR, ACTIVE]
      description: "OFF: PDP not consulted. MONITOR: PDP scores and records, base policy enforced. ACTIVE: PDP verdict enforced."
    TenantPolicy:
      type: object
      additionalProperties: false
      required: [tenant_id, policy_version, score_to_level, level_to_action, fallback_action]
      properties:
        tenant_id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
        policy_version: { type: string, minLength: 1 }
        base_policy:
          $ref: "#/components/schemas/BasePolicy"
        engine_mode:
          $ref: "#/components/schemas/EngineMode"
        score_to_level:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScoreBand"
        level_to_action:
          $ref: "#/components/schemas/LevelToAction"
        fallback_action:
          $ref: "#/components/schemas/Action"
        lockout:
          $ref: "#/components/schemas/LockoutPolicy"
    LockoutPolicy:
      type: object
      additionalProperties: false
      description: "Repeated wrong passwords (ADR-0045): block the source IP, step up the account, pause it only for the owner's own failures."
      properties:
        ip_failures: { type: integer, minimum: 1, default: 10 }
        ip_window_seconds: { type: integer, minimum: 1, default: 900 }
        ip_block_seconds: { type: integer, minimum: 1, default: 1800 }
        foreign_failures_step_up: { type: integer, minimum: 1, default: 3 }
        owner_failures: { type: integer, minimum: 1, default: 5 }
        owner_window_seconds: { type: integer, minimum: 1, default: 900 }
        owner_cooldown_seconds: { type: integer, minimum: 1, default: 900 }
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
        event_id:
          type: string
          format: uuid
  examples:
    EvaluateRequestNovelDevice:
      summary: Successful login from a new device
      value:
        event_id: "4f9a8c2e-1b3d-4a6f-9c8e-2d1b3a6f9c8e"
        tenant_id: "roku-bank"
        application_id: "roku-bank-web"
        user_id: "user-123"
        timestamp: "2026-08-08T15:30:00Z"
        ip_address: "203.0.113.10"
        asn: "13335"
        country: "AR"
        device_type: "mobile"
        os: "Android"
        browser: "Chrome"
        login_successful: true
    EvaluateResponseRequireMfa:
      summary: Medium risk → REQUIRE_MFA
      value:
        event_id: "4f9a8c2e-1b3d-4a6f-9c8e-2d1b3a6f9c8e"
        risk_score: 0.61
        risk_level: MEDIUM
        action: REQUIRE_MFA
        enforced_action: REQUIRE_MFA
        engine_mode: MONITOR
        reasons:
          - code: signal_novel
            signal: device_type
            contribution: 1.8
            detail: "device_type not previously seen for this user"
          - code: signal_novel
            signal: ip_address
            contribution: 1.2
            detail: "ip_address not previously seen for this user"
        model_version: "freeman-0.1.0"
        policy_version: "1.0.0"
        feature_schema_version: "1.0.0"
        fallback: false
        scored_at: "2026-08-08T15:30:00.042Z"
