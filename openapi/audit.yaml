openapi: 3.1.0
info:
  title: RBA audit store — decision read API
  version: 0.3.0
  description: |
    Read model for the IdP-6 decision browser. `rba-audit-service` owns
    `rba_audit.audit_decisions`; this HTTP API is how the IdP BFF lists
    scored logins with reasons. The consumer loop is unchanged.
  contact:
    name: roku-pfi
    url: https://github.com/roku-pfi
servers:
  - url: http://localhost:8002
    description: Local rba-audit-service HTTP
tags:
  - name: audit
    description: Persisted DecisionMade events
paths:
  /healthz:
    get:
      tags: [audit]
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /decisions:
    get:
      tags: [audit]
      operationId: listDecisions
      parameters:
        - in: query
          name: tenant_id
          required: true
          description: ADR-0033. Every read is scoped to one tenant; the IdP fills it from the operator's session.
          schema: { type: string }
        - in: query
          name: user_id
          schema: { type: string }
        - in: query
          name: application_id
          schema: { type: string }
        - in: query
          name: action
          schema:
            type: string
            enum: [ALLOW, REQUIRE_MFA, REAUTHENTICATE, BLOCK]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionListResponse"
  /decisions/summary:
    get:
      tags: [audit]
      operationId: summarizeDecisions
      description: A tenant's decisions counted in the store, for the console's Resumen.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: { type: string }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionSummary"
  /decisions/{event_id}:
    get:
      tags: [audit]
      operationId: getDecision
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "404":
          description: Unknown event_id
components:
  schemas:
    Reason:
      type: object
      additionalProperties: false
      required: [code, signal]
      properties:
        code: { type: string }
        signal: { type: string }
        contribution: { type: number }
        detail: { type: string }
    DecisionSummary:
      type: object
      additionalProperties: false
      required: [since, total, by_action, saved_prompts, hours, countries]
      properties:
        since: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        by_action:
          type: object
          additionalProperties: { type: integer }
        saved_prompts: { type: integer, minimum: 0, description: "MONITOR: engine ALLOW, base policy stepped up." }
        hours:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [hour, counts]
            properties:
              hour: { type: string, format: date-time }
              counts: { type: object, additionalProperties: { type: integer } }
        countries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [country, count]
            properties:
              country: { type: string }
              count: { type: integer, minimum: 0 }
    DecisionRecord:
      type: object
      additionalProperties: false
      required:
        - event_id
        - occurred_at
        - tenant_id
        - application_id
        - user_id
        - risk_score
        - risk_level
        - action
        - enforced_action
        - engine_mode
        - model_version
        - policy_version
        - feature_schema_version
      properties:
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string }
        application_id: { type: string }
        user_id: { type: string }
        risk_score: { type: number, minimum: 0, maximum: 1 }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        action: { type: string, enum: [ALLOW, REQUIRE_MFA, REAUTHENTICATE, BLOCK], description: "The engine's verdict." }
        enforced_action: { type: string, enum: [ALLOW, REQUIRE_MFA, REAUTHENTICATE, BLOCK], description: "What was applied (ADR-0034)." }
        engine_mode: { type: string, enum: [OFF, MONITOR, ACTIVE] }
        simulated: { type: boolean, default: false }
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
        model_version: { type: string }
        policy_version: { type: string }
        feature_schema_version: { type: string }
        fallback: { type: boolean, default: false }
        step_up_passed_at:
          type: [string, "null"]
          format: date-time
          description: When the user passed the step-up this decision asked for (RF-11). Null if none was asked or it was not passed.
        login:
          nullable: true
          description: "The login as observed: where from, which network and device (0.13.0)."
          allOf: [{ $ref: "#/components/schemas/LoginSnapshot" }]
        features:
          nullable: true
          description: "What the model compared it with: which signals were familiar (0.13.0)."
          allOf: [{ $ref: "#/components/schemas/FeatureVectorV1" }]
    LoginSnapshot:
      type: object
      additionalProperties: false
      required: [login_timestamp, ip_address]
      properties:
        login_timestamp: { type: string, format: date-time }
        ip_address: { type: string }
        asn: { type: string, nullable: true }
        country: { type: string, nullable: true }
        device_type: { type: string, nullable: true }
        os: { type: string, nullable: true }
        browser: { type: string, nullable: true }
        login_successful: { type: boolean, default: true }
    FeatureVectorV1:
      type: object
      additionalProperties: false
      properties:
        user_login_count: { type: integer, minimum: 0 }
        ip_seen_before: { type: integer, enum: [0, 1] }
        asn_seen_before: { type: integer, enum: [0, 1] }
        country_seen_before: { type: integer, enum: [0, 1] }
        device_type_seen_before: { type: integer, enum: [0, 1] }
        os_seen_before: { type: integer, enum: [0, 1] }
        browser_seen_before: { type: integer, enum: [0, 1] }
        hour_seen_before: { type: integer, enum: [0, 1] }
        seconds_since_last_login: { type: number }
        failed_logins_last_24h: { type: integer, minimum: 0 }
    DecisionListResponse:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DecisionRecord"
        count: { type: integer, minimum: 0 }
