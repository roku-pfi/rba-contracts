# The platform tenant: RokuSec's own operators. Engine ACTIVE, and LOW maps to
# REQUIRE_MFA, so even a usual login asks for the passkey while unusual ones
# still escalate to reauthentication or a block. "Always MFA, plus the engine"
# needs no extra concept — it is just a ladder.
tenant_id: rokusec
policy_version: "3.0.0"
base_policy: ALWAYS_MFA
engine_mode: ACTIVE
# D-2 (findings/2026-10-22-policy-comparison.md): a score never blocks, it steps up;
# blocks come from rules (failed-login lockout). LOW <= 0.40 costs no detection.
score_to_level:
  - { max: 0.40, level: LOW }
  - { max: 0.60, level: MEDIUM }
  - { max: 0.80, level: HIGH }
  - { max: 1.00, level: CRITICAL }
level_to_action:
  LOW: REQUIRE_MFA
  MEDIUM: REQUIRE_MFA
  HIGH: REAUTHENTICATE
  CRITICAL: REAUTHENTICATE
fallback_action: REQUIRE_MFA
